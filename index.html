<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Sonar Web:S7926 (WCAG 1.4.4, pinch-zoom disabled): accepted. user-scalable=no
         is intentional here to keep the calm, native-app feel this PWA is designed
         for (see AGENTS.md) — accidental pinch-zoom during normal use would break
         that. Revisit if this is reported as a real accessibility barrier. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe1f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rainplay" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>Rainplay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
